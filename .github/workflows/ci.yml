name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Validate data files
        run: node -e "for (const f of ['curated','news']) JSON.parse(require('fs').readFileSync('public/data/'+f+'.json','utf8'))"
      - name: Install Chromium
        run: npx playwright-core install --with-deps chromium
      - name: Browser smoke test
        run: npm run smoke
