name: Update news data

# ดึงข่าวน้ำท่วม/ที่จอดรถ/สภาพอากาศกรุงเทพฯ และตรวจสถานะกล้องไลฟ์ ทุก 30 นาที
# แล้ว commit public/data/news.json + camera_status.json
# หมายเหตุ: GitHub รัน schedule เฉพาะบน default branch (main)
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch news
        run: node scripts/update-news.mjs
      - name: Check live cameras
        # กล้องตรวจไม่ได้ไม่ควรทำให้ข่าวไม่อัปเดต
        continue-on-error: true
        run: node scripts/check-cams.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet -- public/data/news.json public/data/camera_status.json; then
            echo "ไม่มีข้อมูลใหม่"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/news.json public/data/camera_status.json
          git commit -m "data: อัปเดตข่าว/กล้อง $(TZ=Asia/Bangkok date '+%Y-%m-%d %H:%M')"
          git pull --rebase origin main
          git push
