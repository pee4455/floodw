name: Probe camera sources (temporary)
on:
  push:
    branches: [claude/bangkok-weather-flood-app-gffs1j]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update-cams.mjs
      - name: Dump result
        run: |
          echo "DUMP_BEGIN"; gzip -c public/data/itic_cameras.json | base64 -w0; echo; echo "DUMP_END"
