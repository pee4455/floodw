name: Probe highwaytraffic (temporary)
on:
  push:
    branches: [claude/bangkok-weather-flood-app-gffs1j]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update-cams.mjs
      - name: Dump result
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open('public/data/traffic_cameras.json'))
          for c in d['cameras']:
              if c['source'] == 'doh': print(c['ok'], c.get('cors'), c['code'], c['name'][:40], [ (s['label'], s.get('ok'), s.get('cors')) for s in c['streams']])
          PY
          H=$(python3 -c "import json;d=json.load(open('public/data/traffic_cameras.json'));print(next((c['hls'] for c in d['cameras'] if c['source']=='doh' and c['ok']),''))")
          echo "HLS=$H"; [ -n "$H" ] && curl -sS -m 15 -D - -H "Origin: https://pee4455.github.io" "$H" | head -20
          echo "DUMP_BEGIN"; gzip -c public/data/traffic_cameras.json | base64 -w0; echo; echo "DUMP_END"
