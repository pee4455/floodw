name: Probe camera sources (temporary)
on:
  push:
    branches: [claude/bangkok-weather-flood-app-gffs1j]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Diagnose camera image hosts
        run: |
          for u in \
            "https://camera1.iticfoundation.org/jpeg.cgi?camid=PER-3-008" \
            "https://camera1.iticfoundation.org/jpeg2.php?camid=10.8.0.19:8802" \
            "https://camera1.iticfoundation.org/hls/10.8.0.19_8802.m3u8" \
            "https://camerai1.iticfoundation.org/pass/180.180.242.207:1935/Phase3/PER_3_008_IN.stream/playlist.m3u8" \
            "https://camera1.iticfoundation.org/" ; do
            echo "::group::$u"
            curl -sS -v -m 20 -o /tmp/b -w "\nHTTP %{http_code} type=%{content_type} size=%{size_download} ip=%{remote_ip}\n" "$u" 2>&1 | grep -E "^\* (Trying|Connected|SSL|TLS|subject|issuer|expire)|HTTP|curl|Could|resolve|^< " | head -30
            echo "::endgroup::"
          done
          dig +short camera1.iticfoundation.org camerai1.iticfoundation.org || true
