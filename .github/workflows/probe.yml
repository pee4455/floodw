name: Probe camera sources (temporary)
on:
  push:
    branches: [claude/bangkok-weather-flood-app-gffs1j]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run update-cams
        run: node scripts/update-cams.mjs
      - name: Inspect result
        run: |
          python3 - <<'PY'
          import json, collections
          d = json.load(open('public/data/itic_cameras.json'))
          print('total', d['total'], 'ok', d['ok'])
          print(collections.Counter((c['org'], c['ok']) for c in d['cameras']).most_common(20))
          for c in d['cameras'][:8]: print(c['ok'], c['name'], c['lat'], c['lon'], c['img'], c['hls'])
          PY
          IMG=$(python3 -c "import json;d=json.load(open('public/data/itic_cameras.json'));print(next(c['img'] for c in d['cameras'] if c['ok']))")
          HLS=$(python3 -c "import json;d=json.load(open('public/data/itic_cameras.json'));print(next((c['hls'] for c in d['cameras'] if c['ok'] and c['hls']),''))")
          echo "IMG=$IMG"; curl -sS -m 15 -o /dev/null -D - -H "Referer: https://pee4455.github.io/" "$IMG" | head -20
          echo "HLS=$HLS"; curl -sS -m 15 -D - -H "Origin: https://pee4455.github.io" "$HLS" | head -30
