name: Probe js100 (temporary)
on:
  push:
    branches: [claude/bangkok-weather-flood-app-gffs1j]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update-news.mjs
      - name: Dump
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open('public/data/js100.json'))
          print('traffic', len(d['traffic']), 'news', len(d['news']))
          for t in d['traffic'][:5]: print(t['published'], t['categories'], [p['name'] for p in t['places']], t['text'][:80])
          for n in d['news'][:5]: print(n['published'], n['tags'], n['title'][:70])
          n = json.load(open('public/data/news.json'))
          print([f for f in n['feeds'] if f['feed'] == 'จส.100'], sum(1 for i in n['items'] if i.get('feed') == 'จส.100'))
          PY
          echo "DUMP_BEGIN"; gzip -c public/data/js100.json | base64 -w0; echo; echo "DUMP_END"
          echo "NEWS_BEGIN"; gzip -c public/data/news.json | base64 -w0; echo; echo "NEWS_END"
