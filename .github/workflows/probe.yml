name: Probe highwaytraffic (temporary)
on:
  push:
    branches: [claude/bangkok-weather-flood-app-gffs1j]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dump local site camera HTML
        run: |
          cat > /tmp/dbg.mjs <<'JS'
          import { DOH_BASE, parseSiteIds, parseSiteInfo, parseCameraInfo } from './scripts/lib/doh.mjs';
          import { BKK_BBOX } from './scripts/lib/itic.mjs';
          const pm = async (m, siteID) => (await (await fetch(`${DOH_BASE}/home.aspx/${m}`, { method: 'POST', headers: { 'content-type': 'application/json; charset=utf-8' }, body: JSON.stringify({ siteID }) })).json()).d;
          const sites = parseSiteIds(await (await fetch(`${DOH_BASE}/home.aspx`)).text());
          let shown = 0;
          for (const s of sites) {
            const info = parseSiteInfo(await pm('GetSiteInfo', s.id));
            if (!info || info.lat < BKK_BBOX.minLat || info.lat > BKK_BBOX.maxLat || info.lon < BKK_BBOX.minLon || info.lon > BKK_BBOX.maxLon) continue;
            const html = await pm('GetCameraInfo', s.id);
            console.log('=====', s.id, s.code, info.name, info.lat, info.lon, 'parsed:', JSON.stringify(parseCameraInfo(html)));
            if (shown++ < 3) console.log(String(html).replace(/\s+/g, ' ').slice(0, 3000));
            else console.log((String(html).match(/(site_code[^ >]*|src="[^"]+"|<img[^>]+>)/g) || []).slice(0, 8).join(' | '));
          }
          JS
          cp /tmp/dbg.mjs ./dbg.mjs && node dbg.mjs
