name: Probe js100 (temporary)
on:
  push:
    branches: [claude/bangkok-weather-flood-app-gffs1j]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Raw item HTML
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36'
          curl -sSL -m 30 -A "$UA" -o /tmp/t.html https://www.js100.com/en/site/traffic
          curl -sSL -m 30 -A "$UA" -o /tmp/n.html https://www.js100.com/en/site/news
          curl -sSL -m 30 -A "$UA" -o /tmp/m.html -X POST --data 'per_page=12&offset=1' https://www.js100.com/en/site/news/detail_more
          python3 - <<'PY'
          import re
          for f, kw in [('/tmp/t.html', 'มอเตอร์เวย์ สาย 7'), ('/tmp/n.html', 'ปภ.แจ้งเตือนน้ำเหนือ'), ('/tmp/m.html', 'href')]:
              s = open(f, encoding='utf-8', errors='replace').read()
              print('=====', f, len(s))
              i = s.find(kw)
              print(s[max(0, i-2500): i+800] if i >= 0 else s[:3000])
          PY
